compute:
  num_workers: 4
  pin_memory: true
  cudnn_benchmark: true
logging:
  print_every_n_batches: 20
  save_samples_every_n_batches: 100
paths:
  checkpoints_root: ./checkpoints
  samples_root: ./checkpoints/samples
  trained_vae_path: ${paths.checkpoints_root}/vae/best_model.pth
  save_dir: ${paths.checkpoints_root}/rwm
  samples_dir: ${paths.samples_root}/rwm
data:
  videos_folder: ${oc.env:VIDEOS_DIR,data/scenario_1/videos}
  frames_root: ${oc.env:FRAMES_DIR,data/scenario_1/frames}
  frame_step: 5
  img_size: 64
  batch_size: 256
  test_split: 0.2
  input_seq_size: 8
model:
  latent_dim: 512
  hidden_dim: 256
  freeze_vae: true
training:
  num_epochs: 1
  lr: 0.001
  max_norm: 2.0
  warmup_epochs: 8
  free_bits: 1.5
  edge_weight: 100.0
  bg_weight: 0.1
  scheduler_patience: 3
  scheduler_factor: 0.5
  checkpoint_every: 5
  early_stopping_patience: 10
resume_from: null
experiment_name: rwm
device: mps
seed: 42
