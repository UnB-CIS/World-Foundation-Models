mlflow:
  enabled: true
  tracking_uri: ./mlruns
compute:
  num_workers: 4
  pin_memory: true
  cudnn_benchmark: true
logging:
  print_every_n_batches: 20
  save_samples_every_n_batches: 100
paths:
  checkpoints_root: ./checkpoints
  samples_root: ./checkpoints/samples
  save_dir: ${paths.checkpoints_root}/vae
  samples_dir: ${paths.samples_root}/vae
data:
  videos_folder: ${oc.env:VIDEOS_DIR,data/scenario_1/videos}
  frames_root: ${oc.env:FRAMES_DIR,data/scenario_1/frames}
  frame_step: 5
  img_size: 64
  batch_size: 256
  test_split: 0.2
model:
  in_channels: 1
  latent_channels: 16
  action_latent_channels: 16
  spatial_size: 8
training:
  num_epochs: 200
  lr: 0.0005
  max_norm: 2.0
  warmup_epochs: 40
  free_bits: 1.5
  edge_weight: 100.0
  bg_weight: 0.1
  scheduler_patience: 10
  scheduler_factor: 0.5
  checkpoint_every: 5
  early_stopping_patience: 10
experiment_name: vae
device: cuda
seed: 42
